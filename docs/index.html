<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e1a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tetris" />
<title>Tetris</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <!-- 메인 메뉴 -->
  <section id="menu" class="screen active">
    <h1 class="logo">TETRIS</h1>
    <p class="ver" id="verLabel">v1.0.0</p>
    <div class="menu-btns">
      <button class="mbtn primary" data-action="start">시작</button>
      <button class="mbtn" data-action="ranking">랭킹</button>
      <button class="mbtn" data-action="settings">설정</button>
    </div>
    <p class="hint">설치하려면 브라우저 메뉴에서 "홈 화면에 추가"를 누르세요.</p>
    <button id="installBtn" class="mbtn install hidden">앱 설치</button>
  </section>

  <!-- 게임 화면 -->
  <section id="game" class="screen">
    <div class="game-wrap">
      <div class="side left">
        <div class="panel">
          <div class="panel-title">HOLD</div>
          <canvas id="holdCanvas" width="96" height="96"></canvas>
        </div>
        <div class="panel stats">
          <div class="stat"><span>SCORE</span><b id="score">0</b></div>
          <div class="stat"><span>LINES</span><b id="lines">0</b></div>
          <div class="stat"><span>LEVEL</span><b id="level">1</b></div>
        </div>
      </div>
      <canvas id="board" class="board"></canvas>
      <div class="side right">
        <div class="panel">
          <div class="panel-title">NEXT</div>
          <canvas id="nextCanvas" width="96" height="260"></canvas>
        </div>
        <button id="pauseBtn" class="icon-btn" title="일시정지">⏸</button>
        <button id="soundBtn" class="icon-btn" title="소리">🔊</button>
      </div>
    </div>

    <!-- 터치 조작 패드 -->
    <div class="touchpad" id="touchpad">
      <div class="row">
        <button class="tbtn" data-k="left">◀</button>
        <button class="tbtn" data-k="rccw">↺</button>
        <button class="tbtn" data-k="rcw">↻</button>
        <button class="tbtn" data-k="right">▶</button>
      </div>
      <div class="row">
        <button class="tbtn wide" data-k="soft">▼ 소프트</button>
        <button class="tbtn wide drop" data-k="hard">⬇ 하드드롭</button>
        <button class="tbtn" data-k="hold">HOLD</button>
      </div>
    </div>

    <!-- 일시정지 오버레이 -->
    <div id="pauseOverlay" class="overlay hidden">
      <div class="dialog">
        <h2>일시정지</h2>
        <button class="mbtn primary" data-action="resume">계속하기</button>
        <button class="mbtn" data-action="restart">다시 시작</button>
        <button class="mbtn" data-action="toMenu">메뉴로</button>
      </div>
    </div>

    <!-- 게임오버 오버레이 -->
    <div id="overOverlay" class="overlay hidden">
      <div class="dialog">
        <h2>게임 오버</h2>
        <p class="final">점수 <b id="finalScore">0</b></p>
        <div id="nameEntry" class="hidden">
          <p>🎉 새 기록! 이름을 입력하세요</p>
          <input id="nameInput" maxlength="8" placeholder="이름" />
          <button class="mbtn primary" data-action="saveScore">저장</button>
        </div>
        <button class="mbtn" data-action="restart">다시 시작</button>
        <button class="mbtn" data-action="toMenu">메뉴로</button>
      </div>
    </div>
  </section>

  <!-- 랭킹 화면 -->
  <section id="ranking" class="screen">
    <h2>랭킹 (Top 10)</h2>
    <ol id="rankList" class="rank-list"></ol>
    <button class="mbtn" data-action="toMenu">메뉴로</button>
  </section>

  <!-- 설정 화면 -->
  <section id="settings" class="screen">
    <h2>설정</h2>
    <div class="setting-row">
      <label>소리</label>
      <button id="setSound" class="toggle" data-on="true">켜짐</button>
    </div>
    <div class="setting-row">
      <label>음량</label>
      <input id="setVolume" type="range" min="0" max="100" value="70" />
      <span id="volLabel">70%</span>
    </div>
    <div class="setting-row">
      <label>터치 조작 표시</label>
      <button id="setTouch" class="toggle" data-on="true">켜짐</button>
    </div>
    <p class="hint">키보드: ← → 이동, ↓ 소프트드롭, Space 하드드롭, ↑/X 시계회전, Z 반시계, C 홀드, P 일시정지</p>
    <button class="mbtn" data-action="toMenu">메뉴로</button>
  </section>
</div>

<script src="tetris.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
